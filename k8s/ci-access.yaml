# Administrator bootstrap only. Not included in the CI apply overlay.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: proppilot-deployer
  namespace: proppilot
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: proppilot-deployer
  namespace: proppilot
subjects:
  - kind: Group
    name: proppilot-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: proppilot-deployer
  apiGroup: rbac.authorization.k8s.io
