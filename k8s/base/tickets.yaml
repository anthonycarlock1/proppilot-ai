apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets
  labels:
    app.kubernetes.io/name: tickets
    app.kubernetes.io/part-of: proppilot
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tickets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tickets
        app.kubernetes.io/part-of: proppilot
    spec:
      serviceAccountName: tickets
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tickets
          image: proppilot/tickets:not-deployed
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: proppilot-config
          env:
            - name: ASSESSMENT_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: assessment-handoff
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tickets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tickets
  ports:
    - name: http
      port: 8000
      targetPort: http
