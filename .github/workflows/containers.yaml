name: Application containers
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  AWS_ACCESS_KEY_ID: ci-placeholder
  AWS_SECRET_ACCESS_KEY: ci-placeholder
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: 'true'
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ml-and-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ml/requirements.lock.txt
            services/category/requirements.txt
            services/tickets/requirements.txt
      - run: pip install -r services/category/requirements.txt httpx==0.28.1
      - name: Reproduce both baseline models
        run: |
          python ml/training/train_category.py
          python ml/training/train_urgency.py
      - name: API, inference, policy and persistence contracts
        run: |
          python -m unittest discover -s tests -p 'test_category.py' -v
          python -m unittest discover -s tests -p 'test_sagemaker.py' -v
          python -m unittest discover -s tests -p 'test_urgency.py' -v
          python -m unittest discover -s tests -p 'test_tickets.py' -v
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/agent/requirements.lock.txt
      - run: pip install -r services/agent/requirements.lock.txt
      - run: python -m unittest discover -s tests -p 'test_agent.py' -v
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright test --grep-invert 'real browser request'
        working-directory: frontend
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [ml-and-tickets, agent, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [category, urgency, tickets, agent, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select Dockerfile and lowercase image prefix
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$SERVICE" = frontend ]; then
            echo 'file=frontend/Dockerfile' >> "$GITHUB_OUTPUT"
          else
            echo "file=services/$SERVICE/Dockerfile" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ steps.image.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.prefix }}-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      ASSESSMENT_WRITE_TOKEN: ci-only-not-a-cloud-secret
      FRONTEND_URL: http://127.0.0.1:8080
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and pin the published release
        run: python3 scripts/pull_release.py
      - name: Start published containers on the temporary runner
        run: docker compose -f compose.yaml -f compose.release.json up -d --no-build --wait --wait-timeout 180
      - name: Verify real local predictions and internal HTTP routing
        run: |
          python3 scripts/smoke_category.py
          python3 scripts/smoke_urgency.py
          curl --fail http://127.0.0.1:8080/api/health
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npx playwright test --grep-invert 'real browser request'
        working-directory: frontend
      - name: Collect service status
        if: always()
        run: docker compose -f compose.yaml -f compose.release.json ps --all > compose-status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-verification-${{ github.sha }}
          path: |
            release-images.json
            compose-status.txt
            frontend/test-results/
          retention-days: 14
      - name: Stop temporary deployment
        if: always()
        run: docker compose -f compose.yaml -f compose.release.json down
